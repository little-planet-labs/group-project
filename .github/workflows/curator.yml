# Daily curator. The shortlist and screenshot steps are deterministic scripts;
# the curator step is Claude with a gh-only toolset. The checkout is sparse
# (protected paths only), so a merged .claude/, .mcp.json, CLAUDE.md or .npmrc
# can't change how Claude or npx behave in a job that holds the App token and
# the API key.
# The sparse checkout is load-bearing (docs/SETUP.md, spike 12): never widen it.
# Claude's limits, outermost first:
# - curator-guard.mjs (PreToolUse hook): the enforced allowlist for Bash and Read.
# - --allowedTools and --disallowedTools: Claude Code's own rules.
# - CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: keeps ANTHROPIC_API_KEY out of Bash.
# - The curator token can read checks but not write them, has no actions
#   permission, and the App is not a ruleset bypass actor, so a merge still
#   needs App gate + screen success.
# - The hook command ends in `|| exit 2`: Claude Code blocks only on exit 2, so
#   a guard that can't start (missing file, no node) still blocks.
name: Curator

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency: curator

jobs:
  curate:
    runs-on: ubuntu-latest
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/ci/
            /curator/
            /AGENTS.md
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: shortlist-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GP_APP_ID }}
          private-key: ${{ secrets.GP_APP_PRIVATE_KEY }}
          permission-checks: read
          permission-issues: write
          permission-pull-requests: write
      - id: shortlist
        run: node scripts/ci/shortlist.mjs
        env:
          GH_TOKEN: ${{ steps.shortlist-token.outputs.token }}
          GP_APP_ID: ${{ vars.GP_APP_ID }}
      - run: node scripts/ci/curator-screenshots.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          SHORTLIST: ${{ steps.shortlist.outputs.shortlist }}
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GP_APP_ID }}
          private-key: ${{ secrets.GP_APP_PRIVATE_KEY }}
          permission-checks: read
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - id: prompt
        run: node scripts/ci/curator-prompt.mjs
        env:
          SHORTLIST: ${{ steps.shortlist.outputs.shortlist }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
      # Third-party action with the API key and App token: pinned to the commit of v1.0.240.
      - uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app.outputs.token }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          settings: |
            {
              "hooks": {
                "PreToolUse": [
                  {
                    "matcher": "*",
                    "hooks": [
                      {
                        "type": "command",
                        "command": "node ${{ github.workspace }}/scripts/ci/curator-guard.mjs ${{ github.workspace }}/AGENTS.md ${{ runner.temp }}/screenshots || exit 2"
                      }
                    ]
                  }
                ]
              },
              "permissions": { "blockReadsOutsideWorkingDirectories": true }
            }
          claude_args: |
            --add-dir ${{ runner.temp }}/screenshots
            --allowedTools "Read(./AGENTS.md),Read(/${{ runner.temp }}/screenshots/**),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr merge:*),Bash(gh pr close:*),Bash(gh issue create:*),Bash(gh issue list:*)"
            --disallowedTools "Bash(gh pr merge *--admin*),Bash(gh pr merge *--body-file*),Bash(gh pr merge *-F*),Bash(gh pr comment *--body-file*),Bash(gh pr comment *-F*),Bash(gh issue create *--body-file*),Bash(gh issue create *-F*)"
            --model claude-opus-5-5
            --max-turns 40
