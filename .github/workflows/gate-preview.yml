# Gate + preview deploy. workflow_run always runs this file from the default
# branch, with secrets, so it never checks out, installs or runs PR code. The
# checkout is sparse: only protected paths, so no PR-controlled config file
# (.npmrc, .env, package.json) is on disk when npx runs. Untrusted event fields
# are read by the scripts from GITHUB_EVENT_PATH, never interpolated.
# The sparse checkout is load-bearing (docs/SETUP.md, spike 12): never widen it.
name: Gate and preview

on:
  workflow_run:
    workflows: [PR build]
    types: [completed]

permissions:
  actions: read
  contents: read

# One gate at a time per PR branch, so an older run can't post its gate check or
# preview after a newer one. Expressions here never reach a shell.
concurrency:
  group: gate-preview-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: ci-secrets
      deployment: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/ci/
            /wrangler.jsonc
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GP_APP_ID }}
          private-key: ${{ secrets.GP_APP_PRIVATE_KEY }}
          permission-checks: write
          permission-pull-requests: write
      - id: pr
        run: node scripts/ci/resolve-pr.mjs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
      - id: gate
        run: node scripts/ci/gate.mjs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
      - if: steps.gate.outputs.passed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: site
          path: ${{ runner.temp }}/site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - if: steps.gate.outputs.passed == 'true'
        run: node scripts/ci/validate-artifact.mjs "$RUNNER_TEMP/site"
      - if: steps.gate.outputs.passed == 'true'
        run: node scripts/ci/preview-headers.mjs "$RUNNER_TEMP/site"
      - if: steps.gate.outputs.passed == 'true'
        run: mv "$RUNNER_TEMP/site" build
      - if: steps.gate.outputs.passed == 'true'
        # The URLs come from wrangler's ND-JSON output file; stdout mixes progress
        # lines with the JSON and may carry account metadata, so it isn't printed.
        run: npx --yes wrangler@4.147.0 preview --name "pr-$PR_NUMBER" --json > "$RUNNER_TEMP/preview.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
      - if: steps.gate.outputs.passed == 'true'
        run: node scripts/ci/preview-comment.mjs "$RUNNER_TEMP/wrangler-output.ndjson"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
