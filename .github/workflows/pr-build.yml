# Fork-safe PR build: runs PR code with a read-only token and no secrets.
# A fork can edit this file in its own PR, so nothing downstream trusts its
# result on its own; the gate re-checks the run and the PR through the API.
name: PR build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: build/
          retention-days: 7
          include-hidden-files: true
