# Deletes a PR's Worker Preview when the PR closes. pull_request_target has
# secrets, so this job runs no PR code: its only checkout is the default
# branch's pinned wrangler package (scripts/ci/wrangler/, protected), and
# pull_request_target always checks out the default branch. The PR number is an
# integer from the event. --worker-name is needed because there is no
# wrangler.jsonc on disk. If a pull_request_target checkout ever followed a
# non-default base, the main-only ci-secrets environment would still keep the
# secrets away from the job.
name: Preview cleanup

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    environment:
      name: ci-secrets
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/ci/wrangler/
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Lockfile-pinned wrangler, installed with lifecycle scripts disabled,
      # before any token exists in the job and in a step with no secrets.
      - run: npm ci --ignore-scripts --prefix scripts/ci/wrangler
      - run: node scripts/ci/wrangler/node_modules/wrangler/bin/wrangler.js preview delete --name pr-${{ github.event.pull_request.number }} --worker-name groupproject --skip-confirmation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
